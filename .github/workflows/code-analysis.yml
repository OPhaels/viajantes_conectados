name: Code Analysis Bot

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  code-analysis:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code analysis
        id: analysis
        run: python scripts/bot_code_analysis.py --create-issues --github-repo ${{ github.repository }}

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analysis-reports
          path: logs/code_analysis/
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const logsDir = 'logs/code_analysis';

              if (!fs.existsSync(logsDir)) {
                console.log('Diretorio de logs nao encontrado.');
                return;
              }

              const files = fs.readdirSync(logsDir)
                .filter(file => file.endsWith('.md'))
                .map(file => path.join(logsDir, file));

              if (files.length === 0) {
                console.log('Nenhum relatorio encontrado.');
                return;
              }

              const reportPath = files[0];
              const report = fs.readFileSync(reportPath, 'utf8');

              let summary = 'Analise concluida.';
              if (report.includes('## Resumo')) {
                const split = report.split('## Resumo')[1];
                if (split) {
                  summary = split.split('## ')[0].trim();
                }
              }

              const serverUrl = process.env.GITHUB_SERVER_URL;
              const repository = process.env.GITHUB_REPOSITORY;
              const runId = process.env.GITHUB_RUN_ID;
              const status = report.includes('[FAIL]') ? 'Problemas encontrados' : 'Codigo OK';
              const executedAt = new Date().toISOString();

              const body = [
                '## Relatorio de Analise de Codigo',
                '',
                summary,
                '',
                'Relatorio completo:',
                serverUrl + '/' + repository + '/actions/runs/' + runId,
                '',
                'Status: ' + status,
                '',
                'Executado em: ' + executedAt,
              ].join('\n');

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });

            } catch (error) {
              console.log('Erro ao criar comentario:', error);
            }
