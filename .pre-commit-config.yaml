repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        pass_filenames: false
        args: [--max-line-length=200, "--extend-ignore=E203,W503", "apps/"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        pass_filenames: false
        args: [-r, "apps/", --exclude, "*/migrations/*,*/__pycache__/*"]
        additional_dependencies: ["bandit[toml]", "pbr"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]

  - repo: local
    hooks:
      - id: code-analysis-bot
        name: Code Analysis Bot
        entry: python scripts/bot_code_analysis.py
        language: system
        pass_filenames: false
        always_run: true
        description: "Executa analise completa de codigo com Black, Flake8 e Bandit"
