{% extends "base.html" %}
{% load static %}

{% block estilos_extras %}
<style>
    /* WRAPPER */
    .reset-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f9;
        padding: 20px;
    }

    /* CARD */
    .reset-card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        padding: 28px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    /* HEADER */
    .reset-header {
        text-align: center;
        margin-bottom: 20px;
    }

    .reset-header h2 {
        color: #1a3a5c;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .reset-header p {
        color: #777;
        font-size: 14px;
    }

    /* FORM */
    .reset-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group label {
        font-size: 13px;
        color: #555;
        margin-bottom: 5px;
    }

    /* INPUT */
    .form-group input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        transition: 0.2s;
    }

    .form-group input:focus {
        border-color: #1a73e8;
        box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.1);
        outline: none;
    }

    /* BOTÃO */
    .reset-btn {
        margin-top: 10px;
        padding: 12px;
        background: #1a73e8;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        transition: 0.2s;
    }

    .reset-btn:hover {
        background: #1558b0;
    }

    /* ERRO */
    .reset-error {
        background: #fdecea;
        color: #b71c1c;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
    }

    /* 📱 MOBILE */
    @media (max-width: 480px) {
        .reset-card {
            padding: 20px;
            border-radius: 12px;
        }

        .reset-header h2 {
            font-size: 20px;
        }

        .reset-btn {
            font-size: 14px;
        }
    }
</style>
{% endblock %}

{% block conteudo %}
<div class="reset-wrapper">

    <div class="reset-card">

        <div class="reset-header">
            <h2>Nova senha</h2>
            <p>Digite sua nova senha abaixo</p>
        </div>


        <form method="post" class="reset-form">
            {% csrf_token %}

            <div class="form-group">
                <label>Nova senha</label>
                {{ form.new_password1 }}
            </div>

            <div class="form-group">
                <label>Confirmar senha</label>
                {{ form.new_password2 }}
            </div>

            <button type="submit" class="reset-btn">
                Salvar nova senha
            </button>
        </form>

    </div>

</div>
{% endblock %}
